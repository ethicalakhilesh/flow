<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Flow icon">
<title>Flow icon</title>
<style>
.icon{--flow-950:#042F33;--flow-900:#063B44;--flow-800:#07535A;--flow-700:#0F766E;--flow-600:#148C82;--flow-500:#20A890;--flow-400:#34B58A;--flow-300:#67CDA8;--flow-200:#9FE0C5;--flow-100:#BDEBD9;--flow-50:#E8F7F1}
.bg{fill:url(#bgLight)}.top{fill:url(#topLight)}.bottom{fill:url(#bottomLight)}
.theme-dark .bg{fill:url(#bgDark)}.theme-dark .top{fill:url(#topDark)}.theme-dark .bottom{fill:url(#bottomDark)}
.theme-light .bg{fill:url(#bgLight)}.theme-light .top{fill:url(#topLight)}.theme-light .bottom{fill:url(#bottomLight)}
@media(prefers-color-scheme:dark){.auto .bg{fill:url(#bgDark)}.auto .top{fill:url(#topDark)}.auto .bottom{fill:url(#bottomDark)}}
</style>
<defs>
<linearGradient id="bgLight" x1="120" y1="80" x2="920" y2="950" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8F7F1"/></linearGradient>
<linearGradient id="bgDark" x1="100" y1="60" x2="930" y2="960" gradientUnits="userSpaceOnUse"><stop stop-color="#063B44"/><stop offset="1" stop-color="#042F33"/></linearGradient>
<linearGradient id="topLight" x1="285" y1="210" x2="740" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#67CDA8"/><stop offset=".55" stop-color="#20A890"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
<linearGradient id="bottomLight" x1="265" y1="470" x2="690" y2="805" gradientUnits="userSpaceOnUse"><stop stop-color="#07535A"/><stop offset="1" stop-color="#042F33"/></linearGradient>
<linearGradient id="topDark" x1="285" y1="205" x2="735" y2="530" gradientUnits="userSpaceOnUse"><stop stop-color="#9FE0C5"/><stop offset=".55" stop-color="#34B58A"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
<linearGradient id="bottomDark" x1="260" y1="470" x2="690" y2="810" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F7F9F8"/><stop offset="1" stop-color="#DCEFE7"/></linearGradient>
</defs>
<g class="icon auto">
<rect class="bg" x="72" y="72" width="880" height="880" rx="250"/>
<path class="top" d="M291 489C307 370 345 289 420 242C474 208 531 206 624 206L744 206C729 278 696 347 643 390C599 426 553 441 492 441L422 441C367 441 327 458 291 489Z"/>
<path class="bottom" d="M244 810C260 672 306 575 392 522C443 491 499 489 584 489L668 489C653 560 620 625 567 670C527 703 484 720 432 720L390 720C337 720 291 757 244 810Z"/>
</g>
</svg>